services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: shelterstock
      POSTGRES_PASSWORD: localonly
      POSTGRES_DB: shelterstock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shelterstock -d shelterstock"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shelterstock:localonly@db:5432/shelterstock
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
  test-db:
    image: postgres:16.8
    profiles: [test]
    environment:
      POSTGRES_USER: shelterstock
      POSTGRES_PASSWORD: localonly
      POSTGRES_DB: shelterstock_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shelterstock -d shelterstock_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build: ./backend
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://shelterstock:localonly@test-db:5432/shelterstock_test
    command: sh -c "alembic upgrade head && pytest -q"
    depends_on:
      test-db: {condition: service_healthy}
volumes:
  pgdata:
